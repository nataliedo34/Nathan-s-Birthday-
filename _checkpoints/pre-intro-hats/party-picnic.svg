<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-label="Birthday picnic meadow">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BFDFF0"/>
      <stop offset="42%" stop-color="#E8F4F8"/>
      <stop offset="70%" stop-color="#F7E8D4"/>
      <stop offset="100%" stop-color="#D8EBB0"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.35" r="0.55">
      <stop offset="0%" stop-color="#FFF8D8" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#FFE9A0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#FFE9A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillFar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A8C98A"/><stop offset="100%" stop-color="#7EAD68"/>
    </linearGradient>
    <linearGradient id="hillNear" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9BC46F"/><stop offset="100%" stop-color="#6F9E52"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B6D87A"/><stop offset="55%" stop-color="#8FBF5A"/><stop offset="100%" stop-color="#6F9A45"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C48A"/><stop offset="100%" stop-color="#C08A4E"/>
    </linearGradient>
    <linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8F0"/><stop offset="100%" stop-color="#FFE8D8"/>
    </linearGradient>
    <linearGradient id="cakeBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFE8B8"/><stop offset="100%" stop-color="#E8B86A"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#FFE4F0"/>
    </linearGradient>
    <pattern id="check" width="28" height="28" patternUnits="userSpaceOnUse">
      <rect width="28" height="28" fill="#FFF8F0"/>
      <rect width="14" height="14" fill="#F7C4D0" opacity="0.55"/>
      <rect x="14" y="14" width="14" height="14" fill="#F7C4D0" opacity="0.55"/>
    </pattern>
    <pattern id="paper" width="120" height="120" patternUnits="userSpaceOnUse">
      <rect width="120" height="120" fill="#fff" opacity="0"/>
      <circle cx="12" cy="18" r="1.1" fill="#4a3b34" opacity="0.04"/>
      <circle cx="48" cy="62" r="0.9" fill="#4a3b34" opacity="0.035"/>
      <circle cx="90" cy="30" r="1.2" fill="#4a3b34" opacity="0.03"/>
      <circle cx="70" cy="95" r="0.8" fill="#4a3b34" opacity="0.04"/>
      <circle cx="28" cy="88" r="1" fill="#4a3b34" opacity="0.03"/>
    </pattern>
    <filter id="softShadow" x="-20%" y="-10%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dy="5" dx="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.28"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="waterWash" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="1600" height="900" fill="url(#sky)"/>
  <ellipse cx="800" cy="210" rx="420" ry="260" fill="url(#sunGlow)"/>
  <circle cx="800" cy="150" r="58" fill="#FFF6C8" stroke="#E8C86A" stroke-width="3" opacity="0.95"/>
  <circle cx="786" cy="136" r="14" fill="#fff" opacity="0.45"/>

  <!-- Soft clouds -->
  <g opacity="0.88" fill="#FFFDF8" stroke="#D7C8B4" stroke-width="2.2">
    <g transform="translate(160,110)">
      <ellipse cx="60" cy="34" rx="58" ry="24"/><ellipse cx="28" cy="38" rx="34" ry="18"/><ellipse cx="96" cy="36" rx="40" ry="20"/>
    </g>
    <g transform="translate(1180,90)">
      <ellipse cx="70" cy="30" rx="66" ry="26"/><ellipse cx="30" cy="36" rx="36" ry="18"/><ellipse cx="112" cy="34" rx="42" ry="20"/>
    </g>
    <g transform="translate(980,170)" opacity="0.75">
      <ellipse cx="50" cy="24" rx="48" ry="18"/><ellipse cx="20" cy="28" rx="28" ry="14"/>
    </g>
  </g>

  <!-- Distant hills -->
  <g filter="url(#waterWash)">
    <path d="M0 430 C180 370 320 400 480 360 C640 320 760 390 920 350 C1080 310 1240 360 1600 330 L1600 520 L0 520 Z" fill="url(#hillFar)" opacity="0.75"/>
    <path d="M0 500 C220 440 400 470 580 430 C780 380 960 470 1180 430 C1360 400 1480 450 1600 430 L1600 620 L0 620 Z" fill="url(#hillNear)" opacity="0.9"/>
  </g>

  <!-- Mid trees / bushes -->
  <g stroke="#4a3b34" stroke-width="2.6" stroke-linejoin="round">
    <g transform="translate(120,470)">
      <path d="M42 150 V70" stroke="#6B4A32" stroke-width="8" stroke-linecap="round"/>
      <ellipse cx="42" cy="58" rx="48" ry="42" fill="#7EBA62"/><ellipse cx="18" cy="78" rx="28" ry="24" fill="#6FAE55"/><ellipse cx="68" cy="76" rx="30" ry="26" fill="#8BC86E"/>
    </g>
    <g transform="translate(1380,455)">
      <path d="M48 160 V78" stroke="#6B4A32" stroke-width="9" stroke-linecap="round"/>
      <ellipse cx="48" cy="62" rx="54" ry="46" fill="#6FAE55"/><ellipse cx="18" cy="86" rx="30" ry="26" fill="#7EBA62"/><ellipse cx="78" cy="84" rx="32" ry="28" fill="#8BC86E"/>
    </g>
    <g transform="translate(240,560)">
      <ellipse cx="50" cy="40" rx="58" ry="34" fill="#7EBA62"/><ellipse cx="20" cy="52" rx="30" ry="22" fill="#6FAE55"/><ellipse cx="78" cy="50" rx="32" ry="24" fill="#8BC86E"/>
    </g>
    <g transform="translate(1280,555)">
      <ellipse cx="54" cy="42" rx="62" ry="36" fill="#6FAE55"/><ellipse cx="22" cy="54" rx="32" ry="24" fill="#7EBA62"/><ellipse cx="86" cy="52" rx="34" ry="26" fill="#8BC86E"/>
    </g>
  </g>

  <!-- Foreground meadow -->
  <path d="M0 620 C260 580 520 640 800 600 C1080 560 1340 620 1600 590 L1600 900 L0 900 Z" fill="url(#grass)"/>
  <path d="M0 700 C300 670 560 740 860 700 C1160 660 1400 720 1600 690 L1600 900 L0 900 Z" fill="#7FB255" opacity="0.55"/>

  <!-- Grass blades / texture -->
  <g stroke="#4F7A35" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M80 780 q6 -18 2 -28"/><path d="M140 800 q8 -20 3 -32"/><path d="M210 760 q5 -16 1 -26"/>
    <path d="M1380 770 q-6 -18 -2 -28"/><path d="M1460 795 q-7 -20 -2 -30"/><path d="M1520 750 q-5 -14 -1 -24"/>
    <path d="M420 820 q6 -16 2 -26"/><path d="M1180 830 q-6 -18 -2 -28"/>
  </g>

  <!-- Wildflower clusters -->
  <g stroke="#4a3b34" stroke-width="1.8">
    <g transform="translate(90,720)">
      <path d="M20 60 V28" stroke="#5A8A3A" stroke-width="2.4"/><circle cx="20" cy="22" r="8" fill="#F5A0B8"/><circle cx="14" cy="18" r="5" fill="#FFE56B"/><circle cx="28" cy="20" r="5" fill="#A8D8F0"/>
      <path d="M48 64 V34" stroke="#5A8A3A" stroke-width="2.4"/><circle cx="48" cy="28" r="7" fill="#FFE56B"/><circle cx="48" cy="28" r="2.5" fill="#fff"/>
      <path d="M72 58 V30" stroke="#5A8A3A" stroke-width="2.2"/><circle cx="72" cy="24" r="6.5" fill="#C8E6A0"/>
    </g>
    <g transform="translate(1420,730)">
      <path d="M18 55 V26" stroke="#5A8A3A" stroke-width="2.4"/><circle cx="18" cy="20" r="7.5" fill="#A8D8F0"/><circle cx="18" cy="20" r="2.4" fill="#fff"/>
      <path d="M44 60 V32" stroke="#5A8A3A" stroke-width="2.4"/><circle cx="44" cy="26" r="8" fill="#F5A0B8"/>
      <path d="M68 52 V28" stroke="#5A8A3A" stroke-width="2.2"/><circle cx="68" cy="22" r="6" fill="#FFE56B"/>
    </g>
    <g transform="translate(340,780)">
      <circle cx="10" cy="10" r="5" fill="#F5A0B8"/><circle cx="26" cy="6" r="4.5" fill="#FFE56B"/><circle cx="40" cy="12" r="5" fill="#A8D8F0"/>
    </g>
    <g transform="translate(1180,790)">
      <circle cx="8" cy="10" r="5" fill="#FFE56B"/><circle cx="24" cy="6" r="4.5" fill="#F5A0B8"/><circle cx="38" cy="12" r="5" fill="#C8E6A0"/>
    </g>
  </g>

  <!-- Bunting string across picnic -->
  <path d="M260 210 Q800 270 1340 210" stroke="#8A6A52" stroke-width="3.2" fill="none" stroke-linecap="round"/>
  <g stroke="#4a3b34" stroke-width="2" stroke-linejoin="round">
    <path d="M340 222 L370 270 L310 270 Z" fill="#F5A0B8"/>
    <path d="M430 235 L460 284 L400 284 Z" fill="#FFE56B"/>
    <path d="M520 245 L550 294 L490 294 Z" fill="#A8D8F0"/>
    <path d="M610 252 L640 302 L580 302 Z" fill="#C8E6A0"/>
    <path d="M700 256 L730 306 L670 306 Z" fill="#F5A0B8"/>
    <path d="M790 256 L820 306 L760 306 Z" fill="#FFE56B"/>
    <path d="M880 252 L910 302 L850 302 Z" fill="#A8D8F0"/>
    <path d="M970 245 L1000 294 L940 294 Z" fill="#C8E6A0"/>
    <path d="M1060 235 L1090 284 L1030 284 Z" fill="#F5A0B8"/>
    <path d="M1150 222 L1180 270 L1120 270 Z" fill="#FFE56B"/>
  </g>

  <!-- Balloon clusters (left & right posts) -->
  <g filter="url(#softShadow)">
    <g transform="translate(320,250) scale(0.9)">
      <line x1="40" y1="90" x2="70" y2="210" stroke="#8A6A52" stroke-width="1.8"/>
      <line x1="70" y1="70" x2="70" y2="210" stroke="#8A6A52" stroke-width="1.8"/>
      <line x1="100" y1="95" x2="70" y2="210" stroke="#8A6A52" stroke-width="1.8"/>
      <ellipse cx="40" cy="70" rx="26" ry="34" fill="#F5A0B8" stroke="#4a3b34" stroke-width="2.6"/>
      <ellipse cx="70" cy="50" rx="28" ry="36" fill="#FFE56B" stroke="#4a3b34" stroke-width="2.6"/>
      <ellipse cx="102" cy="74" rx="24" ry="32" fill="#A8D8F0" stroke="#4a3b34" stroke-width="2.6"/>
      <path d="M40 104 l-4 8 8 0z" fill="#4a3b34"/><path d="M70 86 l-4 8 8 0z" fill="#4a3b34"/><path d="M102 106 l-4 8 8 0z" fill="#4a3b34"/>
      <circle cx="32" cy="58" r="6" fill="#fff" opacity="0.35"/>
      <circle cx="62" cy="38" r="7" fill="#fff" opacity="0.35"/>
    </g>
    <g transform="translate(1160,240) scale(0.9)">
      <line x1="40" y1="95" x2="70" y2="220" stroke="#8A6A52" stroke-width="1.8"/>
      <line x1="70" y1="75" x2="70" y2="220" stroke="#8A6A52" stroke-width="1.8"/>
      <line x1="100" y1="100" x2="70" y2="220" stroke="#8A6A52" stroke-width="1.8"/>
      <ellipse cx="38" cy="74" rx="25" ry="33" fill="#A8D8F0" stroke="#4a3b34" stroke-width="2.6"/>
      <ellipse cx="70" cy="54" rx="28" ry="36" fill="#F5A0B8" stroke="#4a3b34" stroke-width="2.6"/>
      <ellipse cx="104" cy="78" rx="24" ry="32" fill="#FFE56B" stroke="#4a3b34" stroke-width="2.6"/>
      <path d="M38 107 l-4 8 8 0z" fill="#4a3b34"/><path d="M70 90 l-4 8 8 0z" fill="#4a3b34"/><path d="M104 110 l-4 8 8 0z" fill="#4a3b34"/>
    </g>
  </g>

  <!-- Picnic set (mid-ground, scaled so characters can stand in front) -->
  <g transform="translate(800 620) scale(0.72) translate(-800 -640)">
  <!-- Picnic blanket on grass -->
  <g filter="url(#softShadow)">
    <path d="M420 700 L1180 700 L1240 820 L360 820 Z" fill="url(#check)" stroke="#4a3b34" stroke-width="3.2" stroke-linejoin="round"/>
    <path d="M420 700 L1180 700 L1160 720 L440 720 Z" fill="#fff" opacity="0.25"/>
  </g>

  <!-- Picnic table -->
  <g filter="url(#softShadow)" stroke="#4a3b34" stroke-width="3" stroke-linejoin="round">
    <!-- legs -->
    <rect x="520" y="560" width="18" height="150" rx="3" fill="url(#wood)"/>
    <rect x="1062" y="560" width="18" height="150" rx="3" fill="url(#wood)"/>
    <rect x="580" y="620" width="14" height="120" rx="2" fill="#B8844A"/>
    <rect x="1006" y="620" width="14" height="120" rx="2" fill="#B8844A"/>
    <!-- bench left -->
    <rect x="390" y="680" width="160" height="18" rx="4" fill="url(#wood)"/>
    <rect x="420" y="698" width="12" height="50" rx="2" fill="#B8844A"/>
    <rect x="510" y="698" width="12" height="50" rx="2" fill="#B8844A"/>
    <!-- bench right -->
    <rect x="1050" y="680" width="160" height="18" rx="4" fill="url(#wood)"/>
    <rect x="1080" y="698" width="12" height="50" rx="2" fill="#B8844A"/>
    <rect x="1170" y="698" width="12" height="50" rx="2" fill="#B8844A"/>
    <!-- table top -->
    <path d="M470 530 H1130 L1160 575 H440 Z" fill="url(#wood)"/>
    <path d="M470 530 H1130 L1115 548 H485 Z" fill="#F0D4A0" opacity="0.55"/>
    <!-- cloth drape -->
    <path d="M520 538 H1080 L1105 620 Q1000 650 900 625 Q800 655 700 628 Q600 655 500 622 Z" fill="url(#check)" stroke="#4a3b34" stroke-width="2.8"/>
    <path d="M520 538 H1080 L1068 552 H532 Z" fill="#fff" opacity="0.28"/>
  </g>

  <!-- Table props: cake, gifts, flowers, plates -->
  <g filter="url(#softShadow)" stroke="#4a3b34" stroke-width="2.6" stroke-linejoin="round">
    <!-- cake stand -->
    <ellipse cx="800" cy="575" rx="58" ry="10" fill="#E8D4B8"/>
    <rect x="788" y="555" width="24" height="22" rx="3" fill="#D8C0A0"/>
    <!-- cake -->
    <rect x="742" y="500" width="116" height="58" rx="8" fill="url(#cakeBody)"/>
    <path d="M742 528 H858" stroke="#FFF0E0" stroke-width="10" stroke-linecap="round"/>
    <path d="M742 528 H858" stroke="#F5A0B8" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M752 500 Q800 478 848 500" fill="url(#frost)"/>
    <!-- cherries / berries -->
    <circle cx="772" cy="492" r="7" fill="#E84860"/><circle cx="800" cy="486" r="8" fill="#FF6B7C"/><circle cx="828" cy="492" r="7" fill="#E84860"/>
    <!-- candles -->
    <rect x="776" y="458" width="5" height="28" rx="1.5" fill="#A8D8F0"/>
    <rect x="798" y="452" width="5" height="34" rx="1.5" fill="#F5A0B8"/>
    <rect x="820" y="458" width="5" height="28" rx="1.5" fill="#FFE56B"/>
    <ellipse cx="778.5" cy="454" rx="5" ry="7" fill="#FFE56B" opacity="0.9"/>
    <ellipse cx="800.5" cy="448" rx="5.5" ry="8" fill="#FFE9A0"/>
    <ellipse cx="822.5" cy="454" rx="5" ry="7" fill="#FFE56B" opacity="0.9"/>

    <!-- gift boxes -->
    <g transform="translate(560,530)">
      <rect x="0" y="20" width="70" height="52" rx="4" fill="#A8D8F0"/>
      <rect x="0" y="8" width="70" height="18" rx="3" fill="#7EB8D8"/>
      <rect x="30" y="8" width="10" height="64" fill="#FFE56B"/>
      <rect x="0" y="36" width="70" height="10" fill="#FFE56B"/>
      <circle cx="35" cy="16" r="8" fill="#F5A0B8"/>
    </g>
    <g transform="translate(970,535)">
      <rect x="0" y="18" width="64" height="48" rx="4" fill="#F5A0B8"/>
      <rect x="0" y="6" width="64" height="16" rx="3" fill="#E088A0"/>
      <rect x="27" y="6" width="10" height="60" fill="#FFF6C8"/>
      <rect x="0" y="32" width="64" height="9" fill="#FFF6C8"/>
    </g>
    <g transform="translate(1045,555)">
      <rect x="0" y="12" width="48" height="36" rx="3" fill="#C8E6A0"/>
      <rect x="20" y="12" width="8" height="36" fill="#FFE56B"/>
      <rect x="0" y="26" width="48" height="7" fill="#FFE56B"/>
    </g>

    <!-- flower arrangements -->
    <g transform="translate(640,505)">
      <ellipse cx="28" cy="58" rx="26" ry="12" fill="#E8D4B8"/>
      <rect x="14" y="34" width="28" height="28" rx="4" fill="#E8C48A"/>
      <circle cx="16" cy="22" r="10" fill="#F5A0B8"/><circle cx="34" cy="16" r="11" fill="#FFE56B"/><circle cx="48" cy="26" r="9" fill="#A8D8F0"/>
      <circle cx="28" cy="28" r="8" fill="#C8E6A0"/>
      <path d="M28 34 V48" stroke="#5A8A3A" stroke-width="2.4"/>
    </g>
    <g transform="translate(900,508)">
      <ellipse cx="28" cy="56" rx="24" ry="11" fill="#E8D4B8"/>
      <rect x="15" y="34" width="26" height="26" rx="4" fill="#D4B078"/>
      <circle cx="18" cy="24" r="9" fill="#A8D8F0"/><circle cx="36" cy="18" r="10" fill="#F5A0B8"/><circle cx="46" cy="28" r="8" fill="#FFE56B"/>
    </g>

    <!-- plates / teacups -->
    <ellipse cx="680" cy="575" rx="28" ry="8" fill="#FFF8F0"/>
    <ellipse cx="920" cy="575" rx="28" ry="8" fill="#FFF8F0"/>
    <path d="M655 560 h22 a8 8 0 0 1 0 16 h-22z" fill="#FFF8F0"/>
    <path d="M677 564 h10" stroke="#D7C4B0" stroke-width="2"/>
    <path d="M925 560 h22 a8 8 0 0 1 0 16 h-22z" fill="#FFF8F0"/>
  </g>
  </g>

  <!-- Soft paper overlay -->
  <rect width="1600" height="900" fill="url(#paper)" pointer-events="none"/>
  <!-- Warm vignette -->
  <radialGradient id="vig" cx="0.5" cy="0.45" r="0.75">
    <stop offset="55%" stop-color="#000" stop-opacity="0"/>
    <stop offset="100%" stop-color="#5A3E2E" stop-opacity="0.16"/>
  </radialGradient>
  <rect width="1600" height="900" fill="url(#vig)" pointer-events="none"/>
</svg>
