<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9fcfe8"/><stop offset="100%" stop-color="#e8f5d0"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8c49a"/><stop offset="100%" stop-color="#c49a6a"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffaf2"/><stop offset="100%" stop-color="#f0e2c8"/></linearGradient>
    <filter id="soft"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#8a7358" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="1200" height="800" fill="#e8f0d8"/>
  <rect width="1200" height="360" fill="#dceaf4"/>
  <!-- window light -->
  <rect x="700" y="40" width="360" height="260" rx="8" fill="#fff6d0" opacity="0.35"/>
  <rect x="720" y="60" width="320" height="220" rx="10" fill="#c8e8f8" stroke="#9a7b65" stroke-width="3"/>
  <line x1="880" y1="60" x2="880" y2="280" stroke="#9a7b65" stroke-width="2"/>
  <line x1="720" y1="170" x2="1040" y2="170" stroke="#9a7b65" stroke-width="2"/>
  <!-- desk surface -->
  <rect y="360" width="1200" height="440" fill="#d4b48a"/>
  <rect y="360" width="1200" height="24" fill="url(#wood)" stroke="#9a7b65" stroke-width="1"/>
  <!-- blotter -->
  <rect x="180" y="420" width="840" height="300" rx="12" fill="#f5efe4" stroke="#9a7b65" stroke-width="2"/>
  <rect x="200" y="440" width="800" height="260" rx="8" fill="#fffdf8" stroke="#d7c4b0" stroke-width="1.5"/>
  <!-- washi / stationery -->
  <rect x="80" y="400" width="70" height="100" rx="4" fill="#f5b8c6" opacity="0.7" transform="rotate(-8 115 450)"/>
  <rect x="1000" y="410" width="80" height="60" rx="4" fill="#a8d8f0" opacity="0.75" transform="rotate(6 1040 440)"/>
  <rect x="1040" y="500" width="60" height="60" rx="4" fill="#ffe56b" opacity="0.7"/>
  <!-- scissors / pen -->
  <rect x="960" y="560" width="8" height="70" rx="2" fill="#6b564e"/>
  <circle cx="964" cy="552" r="8" fill="#f5b8c6" stroke="#9a7b65" stroke-width="1"/>
  <!-- sticker sheet -->
  <g transform="translate(60,520)">
    <rect width="90" height="70" rx="6" fill="#fffaf2" stroke="#9a7b65" stroke-width="1.3"/>
    <circle cx="25" cy="25" r="10" fill="#f5b8c6"/><circle cx="55" cy="28" r="10" fill="#ffe56b"/><circle cx="40" cy="50" r="9" fill="#a8d8f0"/>
  </g>

</svg>
