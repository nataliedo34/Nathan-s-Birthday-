<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#9fcfe8"/><stop offset="100%" stop-color="#e8f5d0"/></linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8c49a"/><stop offset="100%" stop-color="#c49a6a"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffaf2"/><stop offset="100%" stop-color="#f0e2c8"/></linearGradient>
    <filter id="soft"><feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#8a7358" flood-opacity="0.18"/></filter>
  </defs>

  <rect width="1200" height="800" fill="#f3e4d4"/>
  <rect y="0" width="1200" height="420" fill="url(#cream)"/>
  <!-- back wall shelves -->
  <rect x="60" y="80" width="1080" height="280" rx="8" fill="#efe0cc" stroke="#9a7b65" stroke-width="2"/>
  <g stroke="#c4a882" stroke-width="2">
    <line x1="80" y1="160" x2="1120" y2="160"/><line x1="80" y1="240" x2="1120" y2="240"/><line x1="80" y1="320" x2="1120" y2="320"/>
  </g>
  <!-- mailboxes -->
  <g transform="translate(120,100)">
    <rect width="70" height="48" rx="6" fill="#f5b8c6" stroke="#9a7b65" stroke-width="1.5"/>
    <rect x="80" width="70" height="48" rx="6" fill="#a8d8f0" stroke="#9a7b65" stroke-width="1.5"/>
    <rect x="160" width="70" height="48" rx="6" fill="#ffe56b" stroke="#9a7b65" stroke-width="1.5"/>
    <rect y="60" width="70" height="48" rx="6" fill="#c5e6a0" stroke="#9a7b65" stroke-width="1.5"/>
    <rect x="80" y="60" width="70" height="48" rx="6" fill="#f5b8c6" stroke="#9a7b65" stroke-width="1.5"/>
    <rect x="160" y="60" width="70" height="48" rx="6" fill="#a8d8f0" stroke="#9a7b65" stroke-width="1.5"/>
  </g>
  <!-- window -->
  <g transform="translate(780,90)">
    <rect width="280" height="200" rx="12" fill="#c8e8f8" stroke="#9a7b65" stroke-width="3"/>
    <line x1="140" y1="0" x2="140" y2="200" stroke="#9a7b65" stroke-width="2"/>
    <line x1="0" y1="100" x2="280" y2="100" stroke="#9a7b65" stroke-width="2"/>
    <rect y="200" width="280" height="16" fill="url(#wood)" stroke="#9a7b65" stroke-width="1.5"/>
  </g>
  <!-- floor -->
  <rect y="420" width="1200" height="380" fill="#d8b88a"/>
  <g stroke="#c4a07a" stroke-width="1.2" opacity="0.45">
    <path d="M0 480 H1200 M0 540 H1200 M0 600 H1200 M0 660 H1200 M0 720 H1200 M0 780 H1200"/>
  </g>
  <!-- desk -->
  <g transform="translate(280,390)" filter="url(#soft)">
    <rect width="640" height="28" rx="4" fill="url(#wood)" stroke="#9a7b65" stroke-width="2"/>
    <rect x="20" y="28" width="40" height="120" fill="#b8895c" stroke="#9a7b65" stroke-width="1.5"/>
    <rect x="580" y="28" width="40" height="120" fill="#b8895c" stroke="#9a7b65" stroke-width="1.5"/>
    <rect x="40" y="-70" width="200" height="70" rx="8" fill="#fffaf2" stroke="#9a7b65" stroke-width="1.5"/>
    <rect x="280" y="-40" width="90" height="40" rx="4" fill="#f5b8c6" stroke="#9a7b65" stroke-width="1.3"/>
    <rect x="390" y="-50" width="70" height="50" rx="4" fill="#a8d8f0" stroke="#9a7b65" stroke-width="1.3"/>
    <ellipse cx="520" cy="-8" rx="28" ry="12" fill="#ffe56b" stroke="#9a7b65" stroke-width="1.2"/>
  </g>
  <!-- envelopes on shelf -->
  <g transform="translate(420,180)" opacity="0.9">
    <rect width="50" height="34" rx="3" fill="#fffaf2" stroke="#9a7b65" stroke-width="1.2" transform="rotate(-8)"/>
    <rect x="40" y="6" width="50" height="34" rx="3" fill="#ffe9c8" stroke="#9a7b65" stroke-width="1.2" transform="rotate(6)"/>
  </g>
  <!-- hanging sign -->
  <g transform="translate(480,20)">
    <line x1="60" y1="0" x2="60" y2="18" stroke="#9a7b65" stroke-width="2"/>
    <line x1="180" y1="0" x2="180" y2="18" stroke="#9a7b65" stroke-width="2"/>
    <rect x="20" y="18" width="200" height="40" rx="10" fill="#fff8ef" stroke="#9a7b65" stroke-width="2"/>
    <text x="120" y="44" text-anchor="middle" font-family="Zen Maru Gothic,Verdana,sans-serif" font-size="16" font-weight="700" fill="#4a3b34">Post Office</text>
  </g>

</svg>
