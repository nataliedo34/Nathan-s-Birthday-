<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="512" height="512" fill="none">
<defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2b888"/><stop offset="100%" stop-color="#b07a48"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffdf6"/><stop offset="100%" stop-color="#f0e0c4"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe8d2"/><stop offset="100%" stop-color="#f0c8a0"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#c8b4e8"/></linearGradient>
    <linearGradient id="roofP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffc4d0"/><stop offset="100%" stop-color="#e07088"/></linearGradient>
    <linearGradient id="roofM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8e0c0"/><stop offset="100%" stop-color="#5a9e6a"/></linearGradient>
    <linearGradient id="roofS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b0d8f5"/><stop offset="100%" stop-color="#4a90c0"/></linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe9a6"/><stop offset="100%" stop-color="#d4a830"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f7ff"/><stop offset="100%" stop-color="#8ec8e8"/></linearGradient>
    <linearGradient id="nightWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6d0"/><stop offset="100%" stop-color="#ffb84a"/></linearGradient>
    <filter id="sh" x="-25%" y="-15%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dy="4" dx="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tile" width="10" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q5 0 10 3" fill="none" stroke="#4a3b34" stroke-width="0.55" opacity="0.28"/>
    </pattern>
  </defs>

<g filter="url(#sh)" transform="translate(25,15)">
  <ellipse cx="115" cy="250" rx="100" ry="12" fill="#4a3b34" opacity="0.12"/>
  <!-- pillars -->
  <rect x="20" y="90" width="28" height="150" rx="4" fill="url(#wood)" stroke="#4a3b34" stroke-width="2.6"/>
  <rect x="182" y="90" width="28" height="150" rx="4" fill="url(#wood)" stroke="#4a3b34" stroke-width="2.6"/>
  <!-- arch -->
  <path d="M20 120 Q115 -10 210 120" fill="url(#roofG)" stroke="#4a3b34" stroke-width="2.8"/>
  <path d="M48 120 Q115 30 182 120" fill="#dff0c8" stroke="#4a3b34" stroke-width="2.4"/>
  <!-- inner opening -->
  <path d="M70 120 Q115 55 160 120 L160 240 L70 240 Z" fill="#c5e89a" stroke="#4a3b34" stroke-width="2.2"/>
  <path d="M85 130 Q115 75 145 130 L145 240 L85 240 Z" fill="#e8f6c8" stroke="#4a3b34" stroke-width="1.8"/>
  <!-- lanterns on arch -->
  <g transform="translate(55,70)">
    <line x1="10" y1="0" x2="10" y2="12" stroke="#4a3b34" stroke-width="2"/>
    <rect x="2" y="12" width="16" height="22" rx="5" fill="#f0a060" stroke="#4a3b34" stroke-width="1.8"/>
    <circle cx="10" cy="22" r="4" fill="#fff6d0" opacity="0.7"/>
  </g>
  <g transform="translate(155,70)">
    <line x1="10" y1="0" x2="10" y2="12" stroke="#4a3b34" stroke-width="2"/>
    <rect x="2" y="12" width="16" height="22" rx="5" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.8"/>
    <circle cx="10" cy="22" r="4" fill="#fff6d0" opacity="0.7"/>
  </g>
  <g transform="translate(105,35)">
    <line x1="10" y1="0" x2="10" y2="10" stroke="#4a3b34" stroke-width="2"/>
    <rect x="2" y="10" width="16" height="22" rx="5" fill="#ffe56b" stroke="#4a3b34" stroke-width="1.8"/>
  </g>
  <!-- flower garland -->
  <path d="M40 100 Q115 70 190 100" fill="none" stroke="#6aaa52" stroke-width="4"/>
  <circle cx="60" cy="92" r="5" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="90" cy="80" r="5" fill="#ffe56b" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="120" cy="75" r="5" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="150" cy="80" r="5" fill="#9fd8f0" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="175" cy="92" r="5" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.2"/>
  <!-- sign -->
  <g transform="translate(75,125)">
    <rect width="80" height="28" rx="8" fill="#fff8ee" stroke="#4a3b34" stroke-width="2.4"/>
    <text x="40" y="19" text-anchor="middle" font-family="Verdana,sans-serif" font-size="11" font-weight="700" fill="#4a3b34">EXIT</text>
  </g>
  <!-- path through -->
  <path d="M90 240 Q115 220 140 240" fill="#e8d4a8" stroke="#4a3b34" stroke-width="1.5"/>
</g>

</svg>