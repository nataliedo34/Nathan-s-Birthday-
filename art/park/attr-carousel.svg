<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" width="512" height="512" fill="none">

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2b888"/><stop offset="100%" stop-color="#b07a48"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffdf6"/><stop offset="100%" stop-color="#f0e0c4"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe8d2"/><stop offset="100%" stop-color="#f0c8a0"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#c8b4e8"/></linearGradient>
    <linearGradient id="roofP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffc4d0"/><stop offset="100%" stop-color="#e07088"/></linearGradient>
    <linearGradient id="roofM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8e0c0"/><stop offset="100%" stop-color="#5a9e6a"/></linearGradient>
    <linearGradient id="roofS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b0d8f5"/><stop offset="100%" stop-color="#4a90c0"/></linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe9a6"/><stop offset="100%" stop-color="#d4a830"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f7ff"/><stop offset="100%" stop-color="#8ec8e8"/></linearGradient>
    <linearGradient id="nightWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6d0"/><stop offset="100%" stop-color="#ffb84a"/></linearGradient>
    <filter id="sh" x="-25%" y="-15%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dy="4" dx="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tile" width="10" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q5 0 10 3" fill="none" stroke="#4a3b34" stroke-width="0.55" opacity="0.28"/>
    </pattern>
  </defs>


<g filter="url(#sh)" transform="translate(20,15)">
  <ellipse cx="120" cy="245" rx="105" ry="14" fill="#4a3b34" opacity="0.12"/>
  <!-- base platform -->
  <ellipse cx="120" cy="210" rx="100" ry="28" fill="#e8c56a" stroke="#4a3b34" stroke-width="2.8"/>
  <ellipse cx="120" cy="205" rx="88" ry="22" fill="#fff6ea" stroke="#4a3b34" stroke-width="2"/>
  <!-- poles + horses -->
  <g id="rides">
    <g transform="translate(55,120)">
      <rect x="10" y="0" width="5" height="85" fill="#d4a830" stroke="#4a3b34" stroke-width="1.5"/>
      <ellipse cx="12" cy="75" rx="18" ry="14" fill="#fff" stroke="#4a3b34" stroke-width="2"/>
      <circle cx="4" cy="75" r="5" fill="none" stroke="#4a3b34" stroke-width="2"/>
      <circle cx="20" cy="75" r="5" fill="none" stroke="#4a3b34" stroke-width="2"/>
      <path d="M0 68 Q12 55 24 68" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.5"/>
    </g>
    <g transform="translate(155,115)">
      <rect x="10" y="0" width="5" height="90" fill="#d4a830" stroke="#4a3b34" stroke-width="1.5"/>
      <ellipse cx="12" cy="80" rx="18" ry="14" fill="#ffe8ee" stroke="#4a3b34" stroke-width="2"/>
      <circle cx="4" cy="80" r="5" fill="none" stroke="#4a3b34" stroke-width="2"/>
      <circle cx="20" cy="80" r="5" fill="none" stroke="#4a3b34" stroke-width="2"/>
      <path d="M0 73 Q12 60 24 73" fill="#9fd8f0" stroke="#4a3b34" stroke-width="1.5"/>
    </g>
    <g transform="translate(100,130)">
      <rect x="10" y="0" width="5" height="75" fill="#d4a830" stroke="#4a3b34" stroke-width="1.5"/>
      <ellipse cx="12" cy="68" rx="16" ry="12" fill="#c5e4f6" stroke="#4a3b34" stroke-width="2"/>
      <circle cx="5" cy="68" r="4.5" fill="none" stroke="#4a3b34" stroke-width="2"/>
      <circle cx="19" cy="68" r="4.5" fill="none" stroke="#4a3b34" stroke-width="2"/>
    </g>
  </g>
  <!-- center pole -->
  <rect x="114" y="70" width="12" height="140" rx="2" fill="#d4a830" stroke="#4a3b34" stroke-width="2"/>
  <!-- ornate canopy -->
  <path d="M30 110 Q120 20 210 110" fill="#fff6ea" stroke="#4a3b34" stroke-width="2.8"/>
  <path d="M40 108 Q120 40 200 108" fill="#f7b7c3"/>
  <path d="M55 105 Q120 55 185 105" fill="#ffe56b" opacity="0.85"/>
  <path d="M70 102 Q120 68 170 102" fill="#9fd8f0" opacity="0.75"/>
  <path d="M30 110 Q120 20 210 110" fill="none" stroke="#4a3b34" stroke-width="2.8"/>
  <!-- canopy scallops -->
  <path d="M30 110 Q45 125 60 110 Q75 125 90 110 Q105 125 120 110 Q135 125 150 110 Q165 125 180 110 Q195 125 210 110" fill="#fff6ea" stroke="#4a3b34" stroke-width="2"/>
  <!-- lights -->
  <circle cx="50" cy="100" r="4" fill="#ffe56b" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="90" cy="70" r="4" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="150" cy="70" r="4" fill="#9fd8f0" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="190" cy="100" r="4" fill="#ffe56b" stroke="#4a3b34" stroke-width="1.2"/>
  <circle cx="120" cy="48" r="5" fill="#fff" stroke="#4a3b34" stroke-width="1.5"/>
  <!-- top finial -->
  <circle cx="120" cy="28" r="8" fill="#ffe56b" stroke="#4a3b34" stroke-width="2"/>
  <path d="M120 12 L123 28 L117 28 Z" fill="#e9899c" stroke="#4a3b34" stroke-width="1.3"/>
