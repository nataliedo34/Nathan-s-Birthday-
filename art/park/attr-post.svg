<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 260" width="512" height="512" fill="none">

  <defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2b888"/><stop offset="100%" stop-color="#b07a48"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffdf6"/><stop offset="100%" stop-color="#f0e0c4"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe8d2"/><stop offset="100%" stop-color="#f0c8a0"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#c8b4e8"/></linearGradient>
    <linearGradient id="roofP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffc4d0"/><stop offset="100%" stop-color="#e07088"/></linearGradient>
    <linearGradient id="roofM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8e0c0"/><stop offset="100%" stop-color="#5a9e6a"/></linearGradient>
    <linearGradient id="roofS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b0d8f5"/><stop offset="100%" stop-color="#4a90c0"/></linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe9a6"/><stop offset="100%" stop-color="#d4a830"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f7ff"/><stop offset="100%" stop-color="#8ec8e8"/></linearGradient>
    <linearGradient id="nightWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6d0"/><stop offset="100%" stop-color="#ffb84a"/></linearGradient>
    <filter id="sh" x="-25%" y="-15%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dy="4" dx="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tile" width="10" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q5 0 10 3" fill="none" stroke="#4a3b34" stroke-width="0.55" opacity="0.28"/>
    </pattern>
  </defs>


<g filter="url(#sh)" transform="translate(20,30)">
  <ellipse cx="120" cy="210" rx="100" ry="14" fill="#4a3b34" opacity="0.12"/>
  <!-- side wall depth -->
  <path d="M200 90 L230 105 L230 185 L200 175 Z" fill="#e8d8b8" stroke="#4a3b34" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- main wall -->
  <rect x="40" y="90" width="160" height="95" rx="6" fill="url(#cream)" stroke="#4a3b34" stroke-width="2.8"/>
  <!-- roof -->
  <path d="M25 95 L120 20 L215 95 Z" fill="url(#roofP)" stroke="#4a3b34" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M25 95 L120 20 L215 95 Z" fill="url(#tile)"/>
  <path d="M215 95 L245 108 L120 20 Z" fill="#d87890" stroke="#4a3b34" stroke-width="2.4" stroke-linejoin="round"/>
  <!-- chimney -->
  <rect x="155" y="35" width="18" height="32" rx="2" fill="#d4a090" stroke="#4a3b34" stroke-width="2"/>
  <rect x="150" y="30" width="28" height="10" rx="2" fill="#c08070" stroke="#4a3b34" stroke-width="2"/>
  <!-- windows -->
  <g transform="translate(58,112)">
    <rect width="36" height="34" rx="3" fill="url(#glass)" stroke="#4a3b34" stroke-width="2.2"/>
    <path d="M18 0 V34 M0 17 H36" stroke="#4a3b34" stroke-width="1.6"/>
    <rect x="-4" y="34" width="44" height="7" rx="2" fill="#8fbf62" stroke="#4a3b34" stroke-width="1.5"/>
    <circle cx="8" cy="32" r="3" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1"/>
    <circle cx="20" cy="30" r="3" fill="#ffe56b" stroke="#4a3b34" stroke-width="1"/>
    <circle cx="32" cy="32" r="3" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1"/>
  </g>
  <g transform="translate(148,112)">
    <rect width="36" height="34" rx="3" fill="url(#glass)" stroke="#4a3b34" stroke-width="2.2"/>
    <path d="M18 0 V34 M0 17 H36" stroke="#4a3b34" stroke-width="1.6"/>
    <rect x="-4" y="34" width="44" height="7" rx="2" fill="#8fbf62" stroke="#4a3b34" stroke-width="1.5"/>
  </g>
  <!-- door -->
  <rect x="105" y="125" width="34" height="58" rx="4" fill="url(#wood)" stroke="#4a3b34" stroke-width="2.4"/>
  <circle cx="130" cy="155" r="3" fill="#ffe56b" stroke="#4a3b34" stroke-width="1.2"/>
  <rect x="112" y="135" width="12" height="14" rx="2" fill="url(#glass)" stroke="#4a3b34" stroke-width="1.3"/>
  <!-- mailbox -->
  <g transform="translate(195,150)">
    <rect width="28" height="22" rx="4" fill="#e9899c" stroke="#4a3b34" stroke-width="2"/>
    <rect x="4" y="6" width="20" height="4" rx="1" fill="#4a3b34" opacity="0.35"/>
    <rect x="12" y="22" width="4" height="16" fill="url(#wood)" stroke="#4a3b34" stroke-width="1.3"/>
    <path d="M2 2 L14 -8 L26 2" fill="#ffe56b" stroke="#4a3b34" stroke-width="1.5"/>
  </g>
  <!-- envelopes -->
  <g transform="translate(48,175)">
    <rect width="22" height="14" rx="2" fill="#fff8ee" stroke="#4a3b34" stroke-width="1.4" transform="rotate(-12)"/>
    <path d="M2 2 L11 8 L20 2" fill="none" stroke="#4a3b34" stroke-width="1.2" transform="rotate(-12)"/>
  </g>
  <g transform="translate(70,182)">
    <rect width="20" height="13" rx="2" fill="#ffe8ee" stroke="#4a3b34" stroke-width="1.3" transform="rotate(8)"/>
  </g>
  <!-- sign -->
  <g transform="translate(88,70)">
    <rect width="64" height="20" rx="6" fill="#fff8ee" stroke="#4a3b34" stroke-width="2"/>
    <text x="32" y="14" text-anchor="middle" font-family="Verdana,sans-serif" font-size="9" font-weight="700" fill="#4a3b34">POST</text>
  </g>
</g>

</svg>