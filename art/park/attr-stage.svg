<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 250" width="512" height="512" fill="none">
<defs>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e2b888"/><stop offset="100%" stop-color="#b07a48"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fffdf6"/><stop offset="100%" stop-color="#f0e0c4"/></linearGradient>
    <linearGradient id="peach" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe8d2"/><stop offset="100%" stop-color="#f0c8a0"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#efe6ff"/><stop offset="100%" stop-color="#c8b4e8"/></linearGradient>
    <linearGradient id="roofP" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffc4d0"/><stop offset="100%" stop-color="#e07088"/></linearGradient>
    <linearGradient id="roofM" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b8e0c0"/><stop offset="100%" stop-color="#5a9e6a"/></linearGradient>
    <linearGradient id="roofS" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#b0d8f5"/><stop offset="100%" stop-color="#4a90c0"/></linearGradient>
    <linearGradient id="roofG" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#ffe9a6"/><stop offset="100%" stop-color="#d4a830"/></linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#e8f7ff"/><stop offset="100%" stop-color="#8ec8e8"/></linearGradient>
    <linearGradient id="nightWin" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#fff6d0"/><stop offset="100%" stop-color="#ffb84a"/></linearGradient>
    <filter id="sh" x="-25%" y="-15%" width="150%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5"/>
      <feOffset dy="4" dx="1"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="tile" width="10" height="6" patternUnits="userSpaceOnUse">
      <path d="M0 3 Q5 0 10 3" fill="none" stroke="#4a3b34" stroke-width="0.55" opacity="0.28"/>
    </pattern>
  </defs>

<g filter="url(#sh)" transform="translate(20,20)">
  <ellipse cx="130" cy="215" rx="115" ry="12" fill="#4a3b34" opacity="0.12"/>
  <!-- stage floor -->
  <path d="M20 160 L240 160 L255 200 L5 200 Z" fill="url(#wood)" stroke="#4a3b34" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M30 168 H230" stroke="#4a3b34" stroke-width="1.2" opacity="0.3"/>
  <!-- back pavilion -->
  <rect x="40" y="50" width="180" height="110" rx="6" fill="#fff6ea" stroke="#4a3b34" stroke-width="2.6"/>
  <!-- curtains -->
  <path d="M40 50 Q70 100 40 160" fill="#e9899c" stroke="#4a3b34" stroke-width="2.2"/>
  <path d="M220 50 Q190 100 220 160" fill="#e9899c" stroke="#4a3b34" stroke-width="2.2"/>
  <path d="M48 55 Q75 95 48 150" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.5"/>
  <path d="M212 55 Q185 95 212 150" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1.5"/>
  <!-- top arch -->
  <path d="M40 55 Q130 10 220 55" fill="#e9899c" stroke="#4a3b34" stroke-width="2.6"/>
  <path d="M55 52 Q130 25 205 52" fill="#ffe56b" opacity="0.7"/>
  <!-- stars -->
  <g fill="#ffe56b" stroke="#4a3b34" stroke-width="1.2">
    <path d="M100 70 l2 6 6 0 -5 4 2 6 -5-4 -5 4 2-6 -5-4 6 0 z"/>
    <path d="M150 65 l2 6 6 0 -5 4 2 6 -5-4 -5 4 2-6 -5-4 6 0 z"/>
    <path d="M125 90 l1.5 5 5 0 -4 3 1.5 5 -4-3.5 -4 3.5 1.5-5 -4-3 5 0 z"/>
  </g>
  <!-- lights -->
  <circle cx="70" cy="48" r="5" fill="#fff6d0" stroke="#4a3b34" stroke-width="1.4"/>
  <circle cx="130" cy="32" r="5" fill="#fff6d0" stroke="#4a3b34" stroke-width="1.4"/>
  <circle cx="190" cy="48" r="5" fill="#fff6d0" stroke="#4a3b34" stroke-width="1.4"/>
  <!-- mic -->
  <rect x="127" y="110" width="5" height="50" fill="#4a3b34"/>
  <circle cx="129.5" cy="105" r="10" fill="#5a5a5a" stroke="#4a3b34" stroke-width="2"/>
  <circle cx="129.5" cy="105" r="5" fill="#2a2a2a"/>
  <!-- bunting -->
  <path d="M50 75 Q130 95 210 70" fill="none" stroke="#4a3b34" stroke-width="1.5"/>
  <path d="M70 80 L78 95 L86 78 Z" fill="#9fd8f0" stroke="#4a3b34" stroke-width="1"/>
  <path d="M120 88 L128 103 L136 86 Z" fill="#f7b7c3" stroke="#4a3b34" stroke-width="1"/>
  <path d="M170 82 L178 97 L186 80 Z" fill="#ffe56b" stroke="#4a3b34" stroke-width="1"/>
</g>

</svg>