<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a2040"/>
      <stop offset="55%" stop-color="#7a2e52"/>
      <stop offset="100%" stop-color="#3a1228"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.65">
      <stop offset="0%" stop-color="#ffe6b0" stop-opacity="0.35"/>
      <stop offset="55%" stop-color="#ffb0c8" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#5a2040" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#c8963a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="700" fill="url(#wall)"/>
  <ellipse cx="600" cy="220" rx="420" ry="260" fill="url(#glow)"/>

  <!-- Decorative stars -->
  <g fill="#ffe9a8" opacity="0.85">
    <path d="M180 120 l8 18 20 2 -15 12 5 19 -18-10 -18 10 5-19 -15-12 20-2z"/>
    <path d="M980 140 l7 15 17 2 -13 10 4 16 -15-8 -15 8 4-16 -13-10 17-2z"/>
    <path d="M260 220 l5 11 12 1 -9 7 3 12 -11-6 -11 6 3-12 -9-7 12-1z" opacity="0.7"/>
    <path d="M900 240 l5 11 12 1 -9 7 3 12 -11-6 -11 6 3-12 -9-7 12-1z" opacity="0.7"/>
    <path d="M600 90 l6 14 15 2 -11 9 4 14 -14-8 -14 8 4-14 -11-9 15-2z"/>
    <circle cx="340" cy="150" r="3"/><circle cx="820" cy="170" r="2.5"/>
    <circle cx="420" cy="100" r="2"/><circle cx="760" cy="110" r="2.2"/>
  </g>

  <!-- Side flower arrangements -->
  <g stroke="#3a2418" stroke-width="2.2" stroke-linejoin="round">
    <g transform="translate(70,380)">
      <ellipse cx="50" cy="120" rx="48" ry="16" fill="#2a1420" opacity="0.35"/>
      <rect x="28" y="70" width="44" height="55" rx="6" fill="#c4a06a"/>
      <circle cx="30" cy="48" r="16" fill="#ff8fb0"/><circle cx="52" cy="34" r="18" fill="#ffe08a"/><circle cx="74" cy="50" r="15" fill="#ffb0c8"/>
      <circle cx="48" cy="56" r="12" fill="#fff0f5"/>
    </g>
    <g transform="translate(1020,380)">
      <ellipse cx="50" cy="120" rx="48" ry="16" fill="#2a1420" opacity="0.35"/>
      <rect x="28" y="70" width="44" height="55" rx="6" fill="#c4a06a"/>
      <circle cx="30" cy="48" r="16" fill="#ffe08a"/><circle cx="52" cy="34" r="18" fill="#ff8fb0"/><circle cx="74" cy="50" r="15" fill="#ffd0e0"/>
      <circle cx="48" cy="56" r="12" fill="#fff6ea"/>
    </g>
  </g>

  <!-- Birthday presents stacked at sides -->
  <g stroke="#3a2418" stroke-width="2.4" stroke-linejoin="round">
    <g transform="translate(100,520)">
      <rect x="0" y="30" width="70" height="52" rx="4" fill="#ffb0c8"/>
      <rect x="28" y="30" width="14" height="52" fill="#ffe08a"/>
      <rect x="0" y="48" width="70" height="12" fill="#ffe08a"/>
      <rect x="10" y="8" width="55" height="28" rx="3" fill="#8ed4ff"/>
      <rect x="30" y="8" width="12" height="28" fill="#fff6ea"/>
    </g>
    <g transform="translate(1030,520)">
      <rect x="0" y="28" width="68" height="50" rx="4" fill="#8ed4ff"/>
      <rect x="26" y="28" width="14" height="50" fill="#ffe08a"/>
      <rect x="0" y="46" width="68" height="12" fill="#ffe08a"/>
      <rect x="12" y="6" width="50" height="28" rx="3" fill="#ff8fb0"/>
      <rect x="30" y="6" width="12" height="28" fill="#fff6ea"/>
    </g>
  </g>

  <!-- Soft garland of hearts / flowers across mid -->
  <g opacity="0.55" fill="#ffb0c8">
    <circle cx="300" cy="300" r="5"/><circle cx="360" cy="288" r="4"/><circle cx="420" cy="296" r="5"/>
    <circle cx="780" cy="296" r="5"/><circle cx="840" cy="288" r="4"/><circle cx="900" cy="300" r="5"/>
  </g>
  <path d="M280 300 Q600 340 920 300" stroke="#e8c76a" stroke-width="2" opacity="0.35" fill="none"/>

  <!-- Balloon clusters (left / right) -->
  <g stroke="#3a2418" stroke-width="2" stroke-linejoin="round">
    <g transform="translate(160,200)">
      <ellipse cx="0" cy="0" rx="22" ry="28" fill="#ff8fb0"/>
      <ellipse cx="28" cy="-10" rx="20" ry="26" fill="#ffe08a"/>
      <ellipse cx="14" cy="18" rx="18" ry="24" fill="#8ed4ff"/>
      <path d="M0 28v40M28 16v48M14 42v30" stroke="#fff6ea" stroke-width="1.4" opacity="0.55"/>
    </g>
    <g transform="translate(1000,200)">
      <ellipse cx="0" cy="0" rx="22" ry="28" fill="#8ed4ff"/>
      <ellipse cx="-28" cy="-10" rx="20" ry="26" fill="#ffb0c8"/>
      <ellipse cx="-12" cy="18" rx="18" ry="24" fill="#ffe08a"/>
      <path d="M0 28v40M-28 16v48M-12 42v30" stroke="#fff6ea" stroke-width="1.4" opacity="0.55"/>
    </g>
  </g>
</svg>
