<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 120" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="cloth" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff8f0"/><stop offset="55%" stop-color="#ffe2d0"/><stop offset="100%" stop-color="#f0c8b8"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#d4b07a"/><stop offset="1" stop-color="#9a6e42"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#c8963a"/><stop offset="50%" stop-color="#ffe9a8"/><stop offset="100%" stop-color="#c8963a"/>
    </linearGradient>
  </defs>
  <!-- shadow -->
  <ellipse cx="110" cy="112" rx="86" ry="8" fill="#2a1420" opacity=".35"/>
  <!-- legs -->
  <rect x="48" y="58" width="10" height="48" rx="3" fill="url(#wood)" stroke="#3A2A22" stroke-width="2.4"/>
  <rect x="162" y="58" width="10" height="48" rx="3" fill="url(#wood)" stroke="#3A2A22" stroke-width="2.4"/>
  <!-- tabletop -->
  <path d="M28 52h164c6 0 10 4 10 9v8c0 5-4 9-10 9H28c-6 0-10-4-10-9v-8c0-5 4-9 10-9z" fill="url(#wood)" stroke="#3A2A22" stroke-width="3" stroke-linejoin="round"/>
  <!-- cloth runner -->
  <path d="M55 48h110c4 0 7 3 7 7v18c0 3-2 5-5 5H53c-3 0-5-2-5-5V55c0-4 3-7 7-7z" fill="url(#cloth)" stroke="#3A2A22" stroke-width="2.4"/>
  <path d="M55 68h110" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <!-- small floral accents on cloth -->
  <g opacity=".85">
    <circle cx="72" cy="58" r="4" fill="#ff8fb0" stroke="#3A2A22" stroke-width="1.4"/>
    <circle cx="110" cy="56" r="3.5" fill="#ffe08a" stroke="#3A2A22" stroke-width="1.4"/>
    <circle cx="148" cy="58" r="4" fill="#ffb0c8" stroke="#3A2A22" stroke-width="1.4"/>
  </g>
  <!-- gold trim edge -->
  <path d="M30 52h160" stroke="url(#gold)" stroke-width="2.2" opacity=".8"/>
</svg>
