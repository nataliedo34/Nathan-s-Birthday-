<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 300" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="tier" x1="40" y1="120" x2="40" y2="230" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFEAB8"/><stop offset="1" stop-color="#EFC67A"/>
    </linearGradient>
    <linearGradient id="tierSide" x1="140" y1="120" x2="230" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4D498"/><stop offset="1" stop-color="#D9AD5C"/>
    </linearGradient>
    <linearGradient id="frost" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fffaf5"/><stop offset="1" stop-color="#FFE2CE"/>
    </linearGradient>
    <linearGradient id="jam" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF9AAB"/><stop offset="1" stop-color="#E04C64"/>
    </linearGradient>
    <linearGradient id="ber" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FF6B7C"/><stop offset="1" stop-color="#C8223A"/>
    </linearGradient>
    <linearGradient id="wax1" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#fff6ea"/><stop offset="1" stop-color="#f0d8b0"/>
    </linearGradient>
    <linearGradient id="wax2" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffd0e0"/><stop offset="1" stop-color="#f090b0"/>
    </linearGradient>
    <linearGradient id="wax3" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#ffe9a8"/><stop offset="1" stop-color="#e8c050"/>
    </linearGradient>
    <radialGradient id="flame" cx="0.45" cy="0.35" r="0.6">
      <stop offset="0%" stop-color="#fff8e0"/>
      <stop offset="45%" stop-color="#ffd078"/>
      <stop offset="100%" stop-color="#ff6a30" stop-opacity="0.85"/>
    </radialGradient>
  </defs>

  <ellipse cx="140" cy="268" rx="88" ry="14" fill="#2a1420" opacity=".35"/>

  <!-- platter -->
  <path d="M52 210 L140 242 L228 210 L228 224 Q140 262 52 224z" fill="#E6D0AE" stroke="#3A2A22" stroke-width="3.4" stroke-linejoin="round"/>

  <!-- cake body -->
  <path d="M52 142 L140 110 L228 142 L228 210 L140 242 L52 210z" fill="url(#tier)" stroke="#3A2A22" stroke-width="3.8" stroke-linejoin="round"/>
  <path d="M140 110 L228 142 L228 210 L140 242z" fill="url(#tierSide)" stroke="#3A2A22" stroke-width="3.8" stroke-linejoin="round"/>

  <!-- cream + jam ribbons -->
  <path d="M52 168 L140 200 L228 168" stroke="#FFF8F0" stroke-width="14"/>
  <path d="M52 168 L140 200 L228 168" stroke="#3A2A22" stroke-width="2.4"/>
  <path d="M52 188 L140 220 L228 188" stroke="url(#jam)" stroke-width="9" stroke-linecap="round" opacity=".92"/>

  <!-- crumb dots -->
  <g fill="#D9A85A" opacity=".42">
    <circle cx="82" cy="154" r="2.4"/><circle cx="108" cy="166" r="2"/><circle cx="96" cy="182" r="2.2"/>
    <circle cx="168" cy="154" r="2.2"/><circle cx="196" cy="170" r="2"/><circle cx="160" cy="184" r="2.4"/>
  </g>

  <!-- fruit on top face -->
  <ellipse cx="98" cy="132" rx="12" ry="7.5" fill="#FF8FA0" stroke="#3A2A22" stroke-width="2.6"/>
  <ellipse cx="140" cy="122" rx="11" ry="7" fill="#FF7A8A" stroke="#3A2A22" stroke-width="2.6"/>
  <ellipse cx="178" cy="132" rx="12" ry="7.5" fill="#FF8FA0" stroke="#3A2A22" stroke-width="2.6"/>

  <!-- whipped cream peaks -->
  <path d="M110 96c-5-20 12-32 28-22 5 3 8 10 8 18 0 0-10-6-18-3s-12 5-18 7z" fill="url(#frost)" stroke="#3A2A22" stroke-width="3.2" stroke-linejoin="round"/>
  <ellipse cx="118" cy="86" rx="10" ry="9" fill="url(#frost)" stroke="#3A2A22" stroke-width="2.8"/>
  <ellipse cx="132" cy="78" rx="10" ry="9" fill="url(#frost)" stroke="#3A2A22" stroke-width="2.8"/>
  <ellipse cx="146" cy="88" rx="9" ry="8" fill="url(#frost)" stroke="#3A2A22" stroke-width="2.8"/>

  <!-- strawberry -->
  <path d="M132 68c-9 0-16 10-16 20 0 12 10 22 16 29 5-7 16-17 16-29 0-10-7-20-16-20z" fill="url(#ber)" stroke="#3A2A22" stroke-width="3.2" stroke-linejoin="round"/>
  <path d="M132 64c4-9 13-8 13 1" stroke="#4F8A3E" stroke-width="3" stroke-linecap="round"/>
  <path d="M132 66c-5-6-11-3-10 2" stroke="#4F8A3E" stroke-width="2.8" stroke-linecap="round"/>

  <!-- candles -->
  <g stroke="#3A2A22" stroke-width="2.2" stroke-linejoin="round">
    <rect x="88" y="58" width="10" height="42" rx="3" fill="url(#wax1)"/>
    <rect x="134" y="48" width="10" height="48" rx="3" fill="url(#wax2)"/>
    <rect x="178" y="56" width="10" height="44" rx="3" fill="url(#wax3)"/>
    <line x1="93" y1="52" x2="93" y2="58" stroke="#5a3e2e" stroke-width="1.6"/>
    <line x1="139" y1="42" x2="139" y2="48" stroke="#5a3e2e" stroke-width="1.6"/>
    <line x1="183" y1="50" x2="183" y2="56" stroke="#5a3e2e" stroke-width="1.6"/>
  </g>

  <!-- flames -->
  <g class="cake-flames">
    <ellipse cx="93" cy="44" rx="7" ry="11" fill="url(#flame)">
      <animate attributeName="ry" values="11;13;10;11" dur="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.95;1;0.88;0.95" dur="0.7s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="139" cy="34" rx="7.5" ry="12" fill="url(#flame)">
      <animate attributeName="ry" values="12;14;11;12" dur="0.85s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="183" cy="42" rx="7" ry="11" fill="url(#flame)">
      <animate attributeName="ry" values="11;12.5;10;11" dur="0.65s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="93" cy="42" r="2.2" fill="#fff8e0" opacity=".9"/>
    <circle cx="139" cy="32" r="2.4" fill="#fff8e0" opacity=".9"/>
    <circle cx="183" cy="40" r="2.2" fill="#fff8e0" opacity=".9"/>
  </g>

  <!-- gold sprinkle -->
  <g fill="#e8c76a" opacity=".7">
    <rect x="74" y="176" width="6" height="2" rx="1" transform="rotate(-20 74 176)"/>
    <rect x="200" y="182" width="6" height="2" rx="1" transform="rotate(18 200 182)"/>
    <rect x="120" y="210" width="5" height="2" rx="1" transform="rotate(-8 120 210)"/>
  </g>
</svg>
