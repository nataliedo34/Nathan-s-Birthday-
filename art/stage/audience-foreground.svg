<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14080e" stop-opacity="0"/>
      <stop offset="35%" stop-color="#14080e" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#0c0508" stop-opacity="0.94"/>
    </linearGradient>
    <linearGradient id="row" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#2e1620"/><stop offset="1" stop-color="#12080e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="160" fill="url(#fade)"/>

  <!-- Soft continuous audience mass with varied head heights -->
  <path fill="url(#row)" opacity="0.9" d="
    M0 160
    L0 118
    C40 118 55 92 78 88
    C98 85 110 102 128 96
    C150 88 162 78 188 82
    C214 86 228 104 252 98
    C278 90 292 76 320 80
    C348 84 360 102 392 96
    C420 90 438 78 468 84
    C498 90 512 108 548 100
    C578 94 592 78 624 82
    C656 86 672 104 706 98
    C738 92 756 76 790 80
    C824 84 842 102 878 96
    C910 90 928 78 962 84
    C996 90 1014 108 1048 100
    C1080 94 1098 80 1132 86
    C1160 90 1180 108 1200 112
    L1200 160 Z"/>

  <!-- Secondary softer heads peeking -->
  <g fill="#1a0c14" opacity="0.55">
    <ellipse cx="96" cy="102" rx="18" ry="16"/>
    <ellipse cx="210" cy="96" rx="16" ry="14"/>
    <ellipse cx="340" cy="100" rx="20" ry="15"/>
    <ellipse cx="510" cy="94" rx="17" ry="15"/>
    <ellipse cx="670" cy="98" rx="19" ry="16"/>
    <ellipse cx="840" cy="92" rx="16" ry="14"/>
    <ellipse cx="1000" cy="100" rx="18" ry="15"/>
    <ellipse cx="1140" cy="96" rx="17" ry="14"/>
  </g>

  <!-- Tiny warm catchlights from stage -->
  <g fill="#ffb0c8" opacity="0.07">
    <ellipse cx="210" cy="90" rx="8" ry="4"/>
    <ellipse cx="670" cy="92" rx="9" ry="4"/>
    <ellipse cx="1000" cy="94" rx="8" ry="4"/>
  </g>
</svg>
